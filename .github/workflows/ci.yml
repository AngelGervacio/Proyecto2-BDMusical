name: Integración Continua C++

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build g++-14 doxygen libgtest-dev libsqlite3-dev libutfcpp-dev libtag1-dev \
	      build-essential qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools qml6-module-qtquick \
	      qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qt-labs-qmlmodels \
	      qml6-module-qtquick-effects

      - name: Configurar
        run: meson setup build

      - name: Compilar
        run: meson compile -C build

      - name: Instalar
        run: sudo meson install -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Documentación
        run: doxygen Doxyfile